name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build XPI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run lint

      - name: Run regression tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Verify package contents
        run: npm run verify:package

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: lexiflow-zotero9-translator-${{ github.sha }}
          path: |
            build/lexiflow-zotero9-translator.xpi
            build/update.json
          if-no-files-found: error
          retention-days: 14
